<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A surprise from Aryan</title>
<style>
:root{
  --bg:#fff3d6; --ink:#2b1b3d; --card:#ffffff; --pink:#ff4f8b; --teal:#12b5a6; --line:#2b1b3d;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1e1530; --ink:#fff3d6; --card:#2c2045; --pink:#ff6fa3; --teal:#3fd8c8; --line:#fff3d6; }
}
:root[data-theme="dark"]{ --bg:#1e1530; --ink:#fff3d6; --card:#2c2045; --pink:#ff6fa3; --teal:#3fd8c8; --line:#fff3d6; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
main{width:100%;max-width:440px}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:26px 22px;box-shadow:7px 7px 0 var(--pink)}
h1{font-size:2rem;line-height:1.1;margin:0 0 8px}
p{line-height:1.5;margin:0 0 16px;font-size:1.05rem}
label{display:block;font-weight:700;margin:14px 0 6px}
input{width:100%;font:inherit;padding:12px 14px;border:3px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:4px solid var(--teal);outline-offset:2px}
button{font:inherit;font-weight:800;cursor:pointer;width:100%;margin-top:20px;padding:14px;border:3px solid var(--line);border-radius:14px;background:var(--pink);color:#fff;box-shadow:4px 4px 0 var(--line);transition:transform .08s}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
button.alt{background:var(--teal);color:#06302c}
.price{font-size:3.2rem;font-weight:800;color:var(--pink);margin:4px 0 12px}
.err{color:#d92b4b;font-weight:700;min-height:1.4em;margin:10px 0 0}
.hidden{display:none}
.big{font-size:6rem;text-align:center;margin:10px 0}
.pic{width:100%;border-radius:14px;border:3px solid var(--line);display:block}
.small{font-size:.9rem;opacity:.8}
@media (prefers-reduced-motion:no-preference){ .big{animation:wob 1.2s ease-in-out infinite} }
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
</style>
</head>
<body>
<main>

<!-- PAGE 1 -->
<section id="p1" class="card">
  <h1>Hey you! Tell us about yourself</h1>
  <p>Fill in your details to continue.</p>
  <label for="name">Your name</label>
  <input id="name" autocomplete="off" placeholder="Enter your full name">
  <label for="age">Your age</label>
  <input id="age" type="number" min="1" max="120" inputmode="numeric" placeholder="Enter your age">
  <label for="dob">Date of birth</label>
  <input id="dob" type="date">
  <p class="err" id="e1" role="alert"></p>
  <button id="go1">Continue</button>
</section>

<!-- PAGE 2 -->

var $ = function(id){ return document.getElementById(id); };
function show(id){ ["p1","p2","p3"].forEach(function(p){ $(p).classList.toggle("hidden", p !== id); }); window.scrollTo(0,0); }

$("go1").onclick = function(){
  var n = $("name").value.trim(), a = $("age").value.trim(), d = $("dob").value;
  if(!n || !a || !d){ $("e1").textContent = "Please fill in your name, age and date of birth."; return; }
  $("e1").textContent = "";
  $("hi").textContent = "Hi " + n + "!";
  show("p2");
};

$("unlock").onclick = function(){
  var b = $("unlock"); b.disabled = true; b.textContent = "Verifying payment…";
  $("e2").textContent = "Checking with the bank, please wait…";
  setTimeout(function(){
  if(FUNNY_IMAGE){ $("reveal").innerHTML = '<img class="pic" alt="Your surprise" src="' + FUNNY_IMAGE + '">'; }
  show("p3");
  }, 4000);
};
</script>
